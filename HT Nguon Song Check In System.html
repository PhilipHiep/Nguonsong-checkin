<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguồn Sống OS - Final Connection Fix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .status-done { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-pending { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .status-free { background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
    .loading-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .btn-processing { background-color: #94a3b8 !important; cursor: not-allowed !important; pointer-events: none; opacity: 0.7; }
    .modal-overlay { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    .edit-trigger:hover { color: #2563eb; transform: scale(1.1); }
  </style>
</head>
<body>

  <div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside class="w-80 bg-white border-r p-6 flex flex-col gap-6 shadow-xl z-10">
      <div>
        <h1 class="font-black text-2xl text-blue-600 uppercase italic text-center">Nguồn Sống OS</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest italic text-center">3-Station Sync System</p>
      </div>

      <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
        <p class="text-[10px] font-black text-slate-500 uppercase mb-2">Configuration / Cấu hình</p>
        <input type="password" id="scriptUrl" placeholder="Google Script URL..." class="w-full p-2 text-[10px] border rounded-lg outline-none mb-2">
        <button onclick="fetchData()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-[10px] font-bold uppercase hover:bg-black transition-all">Connect / Kết nối</button>
      </div>

      <div class="space-y-3 pt-4 border-t">
        <p class="text-xs font-black text-slate-600 uppercase tracking-widest flex items-center gap-2 mb-2">
          <i class="fas fa-user-plus text-blue-500"></i> Registration / Đăng ký
        </p>
        
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Full Name / Họ và tên</label>
          <input type="text" id="newName" placeholder="Enter name..." class="w-full p-3 rounded-xl border text-sm outline-none bg-white transition-all">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-blue-500 uppercase ml-1">Family Code / Mã gia đình</label>
          <input type="text" id="newCode" placeholder="e.g. 101" class="w-full p-3 rounded-xl border-2 border-blue-100 text-sm outline-none bg-blue-50/30 font-bold">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Phone / Số điện thoại</label>
          <input type="text" id="newPhone" placeholder="090..." class="w-full p-3 rounded-xl border text-sm outline-none bg-white">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Payment / Thanh toán</label>
          <select id="newPayment" class="w-full p-3 rounded-xl border text-sm outline-none bg-white">
            <option value="Pending">Pending / Chưa đóng</option>
            <option value="Done">Done / Đã đóng</option>
            <option value="Free">Free / Miễn phí (Kid / Trẻ em)</option>
          </select>
        </div>

        <button id="saveBtn" onclick="saveToGoogle()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-xs uppercase shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all mt-2">
          Save & Continue / Lưu & Tiếp tục
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-10">
      <div class="max-w-4xl mx-auto">
        <div class="flex flex-col gap-4 mb-10">
          <div class="flex justify-between items-center">
             <div class="relative flex-1">
                <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-300 text-xl"></i>
                <input type="text" id="searchInput" onkeyup="renderList()" placeholder="Search Name or Family Code..." 
                  class="w-full pl-16 pr-6 py-6 bg-white shadow-2xl shadow-blue-100/20 rounded-[2rem] text-xl font-bold outline-none border-none focus:ring-4 focus:ring-blue-100 transition-all">
              </div>
              <button onclick="fetchData()" class="ml-4 w-16 h-16 bg-white rounded-full shadow-lg text-blue-600 flex items-center justify-center active:scale-90 transition-all">
                <i class="fas fa-sync-alt text-xl" id="syncIcon"></i>
              </button>
          </div>
          
          <div id="familyActionBox" class="hidden">
             <button id="familyBtn" onclick="payFullFamily()" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-black uppercase text-sm shadow-xl shadow-orange-100 flex items-center justify-center gap-3 hover:bg-orange-600 transition-all">
               <i class="fas fa-users text-xl"></i> PAY FOR ENTIRE FAMILY / THU TIỀN CẢ GIA ĐÌNH
             </button>
          </div>
        </div>

        <div id="resultList" class="space-y-4"></div>
      </div>
    </main>
  </div>

  <!-- MODAL QUICK FIX STATUS -->
  <div id="statusModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl">
      <h2 class="text-xl font-black text-slate-800 mb-2 uppercase italic">Update Status</h2>
      <p id="statusTargetName" class="text-blue-600 font-bold mb-6 border-b pb-2"></p>
      <div class="space-y-3">
        <button onclick="applyStatusFix('Pending')" class="w-full py-4 rounded-2xl bg-red-50 text-red-600 font-bold uppercase text-xs border border-red-100 hover:bg-red-100 transition-all">Pending (Chưa đóng)</button>
        <button onclick="applyStatusFix('Done')" class="w-full py-4 rounded-2xl bg-green-50 text-green-600 font-bold uppercase text-xs border border-green-100 hover:bg-green-100 transition-all">Done (Đã đóng)</button>
        <button onclick="applyStatusFix('Free')" class="w-full py-4 rounded-2xl bg-blue-50 text-blue-600 font-bold uppercase text-xs border border-blue-100 hover:bg-blue-100 transition-all">Free (Trẻ em)</button>
        <button onclick="closeModals()" class="w-full py-3 mt-4 text-slate-400 font-bold uppercase text-[10px] tracking-widest">Cancel</button>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT NAME -->
  <div id="nameModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl">
      <h2 class="text-xl font-black text-slate-800 mb-6 uppercase italic">Edit Name</h2>
      <div class="space-y-4">
        <input type="text" id="editNameInput" class="w-full p-4 rounded-xl border-2 border-blue-100 outline-none font-bold text-lg">
        <button onclick="applyNameFix()" class="w-full py-4 rounded-2xl bg-blue-600 text-white font-bold uppercase text-xs shadow-lg hover:bg-blue-700 transition-all">Update Name</button>
        <button onclick="closeModals()" class="w-full py-3 text-slate-400 font-bold uppercase text-[10px] tracking-widest text-center">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let masterData = [];
    let isWorking = false;
    let currentFilteredFamilyCode = null;
    let currentEditingName = null;

    window.onload = () => {
      const savedUrl = localStorage.getItem('nguonSongUrl');
      if(savedUrl) { document.getElementById('scriptUrl').value = savedUrl; fetchData(); }
      document.getElementById('newName').focus();
    };

    // HÀM LẤY DỮ LIỆU TỪ GOOGLE
    async function fetchData() {
      const url = document.getElementById('scriptUrl').value;
      if(!url) return;
      localStorage.setItem('nguonSongUrl', url);
      const syncIcon = document.getElementById('syncIcon');
      syncIcon.classList.add('loading-spinner');
      try {
        const response = await fetch(url);
        masterData = await response.json();
        renderList();
      } catch (e) { 
        console.error("Sync Error:", e);
      } finally { 
        syncIcon.classList.remove('loading-spinner'); 
      }
    }

    // HÀM GỬI LỆNH QUA JSONP (Vượt lỗi CORS và nhận phản hồi Success)
    function sendCommand(params) {
      return new Promise((resolve, reject) => {
        const url = document.getElementById('scriptUrl').value;
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          const scriptTag = document.getElementById(callbackName);
          if(scriptTag) document.body.removeChild(scriptTag);
          resolve(data);
        };

        const script = document.createElement('script');
        script.id = callbackName;
        let queryString = `?callback=${callbackName}`;
        for (let key in params) {
          queryString += `&${key}=${encodeURIComponent(params[key])}`;
        }
        script.src = url + queryString;
        document.body.appendChild(script);
      });
    }

    function isFree(status) {
      if(!status) return false;
      const s = status.toString().toLowerCase();
      return s.includes('free') || s.includes('kid') || s.includes('<10');
    }

    // MỞ MODAL SỬA TRẠNG THÁI
    function openStatusFix(name) {
      currentEditingName = name;
      document.getElementById('statusTargetName').innerText = name;
      document.getElementById('statusModal').classList.remove('hidden');
    }

    // MỞ MODAL SỬA TÊN
    function openNameFix(name) {
      currentEditingName = name;
      document.getElementById('editNameInput').value = name;
      document.getElementById('nameModal').classList.remove('hidden');
    }

    function closeModals() {
      document.getElementById('statusModal').classList.add('hidden');
      document.getElementById('nameModal').classList.add('hidden');
    }

    async function applyStatusFix(newStatus) {
      closeModals();
      isWorking = true;
      try {
        const res = await sendCommand({ action: 'UpdateSingle', name: currentEditingName, payment: newStatus });
        if(res.status === 'success') {
          await fetchData();
          alert("Updated / Đã cập nhật!");
        }
      } catch (e) { alert("Error!"); }
      finally { isWorking = false; }
    }

    async function applyNameFix() {
      const newName = document.getElementById('editNameInput').value.trim();
      if(!newName || newName === currentEditingName) return;
      closeModals();
      isWorking = true;
      try {
        // Gửi lệnh đổi tên (Action UpdateSingle sẽ tìm theo tên cũ và ghi đè tên mới nếu bạn cập nhật Script)
        const res = await sendCommand({ action: 'UpdateName', oldName: currentEditingName, newName: newName });
        if(res.status === 'success') { await fetchData(); }
      } catch (e) { alert("Error!"); }
      finally { isWorking = false; }
    }

    function renderList() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultList = document.getElementById('resultList');
      const familyBox = document.getElementById('familyActionBox');
      
      if(!query) { resultList.innerHTML = ""; familyBox.classList.add('hidden'); return; }

      let filteredRaw = masterData.filter(item => 
        (item.Name && item.Name.toString().toLowerCase().includes(query)) || 
        (item['Family Code'] && item['Family Code'].toString().includes(query))
      );

      const uniqueDataMap = {};
      filteredRaw.forEach(item => { uniqueDataMap[item.Name.toString().trim()] = item; });
      const filtered = Object.values(uniqueDataMap);

      const hasPayableMember = filtered.some(i => i.Payment !== 'Done' && !isFree(i.Payment));
      const isFamilySearch = filtered.length > 1 && filtered.every(i => i['Family Code'] == filtered[0]['Family Code']);
      
      if(isFamilySearch && filtered[0]['Family Code'] && hasPayableMember) {
        currentFilteredFamilyCode = filtered[0]['Family Code'];
        familyBox.classList.remove('hidden');
      } else {
        familyBox.classList.add('hidden');
      }

      resultList.innerHTML = filtered.map((item, index) => {
        const free = isFree(item.Payment);
        const done = item.Payment === 'Done';
        const statusClass = done ? 'status-done' : (free ? 'status-free' : 'status-pending');


        return `
          <div class="bg-white p-6 rounded-[1.5rem] shadow-sm border border-slate-100 flex items-center justify-between hover:shadow-md transition-all">
            <div class="flex items-center gap-5">
              <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl font-black uppercase">
                ${item.Name ? item.Name.toString().charAt(0) : '?'}
              </div>
              <div>
                <h3 class="font-black text-slate-800 uppercase text-lg tracking-tight flex items-center gap-2">
                  ${item.Name}
                  <i onclick="openNameFix('${item.Name}')" class="fas fa-pen text-[10px] text-slate-300 cursor-pointer edit-trigger transition-all" title="Edit Name / Sửa Tên Họ"></i>
                  </h3>
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">#${item.Phone || '---'}</p>
              </div>
            </div>
            
            <div class="flex items-center gap-6">
              <div class="min-w-[160px] flex items-center justify-center gap-2">
                <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Family Code</p>
                <p class="font-mono font-black text-2xl text-blue-600">#${item['Family Code'] || '---'}</p>
              </div>
              <div class="min-w-[140px] text-center">
                <span class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase ${statusClass}">
                  ${free ? 'FREE / MIỄN PHÍ' : (item.Payment || 'Pending')}
                </span>
                <i onclick="openStatusFix('${item.Name}')" class="fas fa-pen text-[10px] text-slate-300 cursor-pointer edit-trigger transition-all gap-4" title="Edit Payment / Sửa Thanh toán"></i>
              </div>
              
              <div class="flex gap-2 border-l pl-6">
                ${(!done && !free) ? `
                  <button onclick="updateSinglePayment('${item.Name}', '${item['Family Code']}', ${index})" class="bg-green-500 text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase shadow-lg hover:bg-green-600 transition-all">
                    PAY / THU TIỀN
                  </button>
                ` : `
                  <button class="bg-slate-100 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase cursor-not-allowed">
                    ${free ? 'KID / TRẺ EM' : 'COMPLETED'}
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function saveToGoogle(customData = null) {
      const url = document.getElementById('scriptUrl').value;
      const saveBtn = document.getElementById('saveBtn');
      if(isWorking || !url) return;

      let payload = customData || {
        Name: document.getElementById('newName').value.trim(),
        FamilyCode: document.getElementById('newCode').value.trim(),
        Phone: document.getElementById('newPhone').value.trim(),
        Payment: document.getElementById('newPayment').value
      };

      if(!payload.Name) return;
      isWorking = true;
      saveBtn.disabled = true;
      saveBtn.classList.add('btn-processing');
      saveBtn.innerHTML = '<i class="fas fa-spinner loading-spinner"></i> PROCESSING / ĐANG GHI NHẬN...';

      try {
        // Dùng POST cho đăng ký mới
        await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        
        if(!customData) {
          document.getElementById('newName').value = "";
          document.getElementById('newPhone').value = "";
        }
        
        saveBtn.innerHTML = '<i class="fas fa-sync loading-spinner"></i> SYNCING / ĐANG ĐỒNG BỘ...';
        setTimeout(async () => {
          await fetchData();
          isWorking = false;
          saveBtn.disabled = false;
          saveBtn.classList.remove('btn-processing');
          saveBtn.innerHTML = 'Save & Continue / Lưu & Tiếp tục';
          document.getElementById('newName').focus();
        }, 1500);
      } catch (e) { 
        alert("Network Error / Lỗi kết nối!"); 
        isWorking = false;
        saveBtn.disabled = false;
        saveBtn.classList.remove('btn-processing');
      }
    }

    async function updateSinglePayment(name, code, idx) {
      if(isWorking) return;
      if(confirm(`Confirm payment for / Xác nhận thu tiền cho: ${name}?`)) {
        isWorking = true;
        const btn = document.getElementById('btn-pay-'+idx);
        btn.innerHTML = 'WAIT...';
        btn.classList.add('btn-processing');

        try {
          const result = await sendCommand({ action: 'UpdateSingle', name: name, payment: 'Done' });
          if(result.status === 'success') {
            setTimeout(async () => {
              await fetchData();
              isWorking = false;
              alert("✅ DONE / THÀNH CÔNG!");
            }, 1000);
          }
        } catch (e) {
          alert("Error / Lỗi!");
          isWorking = false;
          fetchData();
        }
      }
    }

    async function payFullFamily() {
      if(isWorking) return;
      const familyBtn = document.getElementById('familyBtn');
      
      if(confirm(`Confirm payment for ALL members / Thu tiền cho TẤT CẢ thành viên gia đình #${currentFilteredFamilyCode}?`)) {
        isWorking = true;
        familyBtn.classList.add('btn-processing');
        familyBtn.innerHTML = '<i class="fas fa-spinner loading-spinner"></i> PROCESSING / ĐANG GHI NHẬN...';

        try {
          const result = await sendCommand({ action: 'UpdateFamily', familyCode: currentFilteredFamilyCode });
          
          if(result.status === 'success') {
            familyBtn.innerHTML = '<i class="fas fa-sync loading-spinner"></i> SYNCING / ĐANG ĐỒNG BỘ...';
            setTimeout(async () => {
              await fetchData();
              isWorking = false;
              familyBtn.classList.remove('btn-processing');
              familyBtn.innerHTML = '<i class="fas fa-users text-xl"></i> PAY FOR ENTIRE FAMILY / THU TIỀN CẢ GIA ĐÌNH';
              alert("✅ DONE / THÀNH CÔNG! \nData updated / Dữ liệu đã khớp.");
            }, 1500);
          }
        } catch (e) {
          alert("Connection Error / Lỗi kết nối!");
          isWorking = false;
          familyBtn.classList.remove('btn-processing');
          familyBtn.innerHTML = '<i class="fas fa-users text-xl"></i> PAY FOR ENTIRE FAMILY / THU TIỀN CẢ GIA ĐÌNH';
        }
      }
    }
  </script>
</body>
</html>
